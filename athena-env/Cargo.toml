[package]
name = "athena-env"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ATHENA's us54 rules core: a port of lib/engine/ (the reference), gated by replaying the athena-replay-1 corpus byte for byte."
publish = false
rust-version = "1.80"

# D12 (ATHENA.md §5): the core is pure computation with no network, file or process access, and the crate has no
# dependencies at all. The Python bindings are a separate crate, `py/` (API.md), so they add none here.
[dependencies]

[features]
default = []
# The planted mutants M1-M5 of ATHENA.md §4.6 G0a, M6-M7 of §8.1 G1a and G1b's full-reveal control. Off in every
# normal build: without this feature their code paths are not compiled at all. `replay-check --mutant Mk` and
# `facts-check --mutant Mk | --control full-reveal` need `--features mutants`.
mutants = []

[lib]
name = "athena_env"
path = "src/lib.rs"

# The G0a (i) checker: replays the corpus from its actions alone and compares every digest and verdict.
[[bin]]
name = "replay-check"
path = "src/bin/replay-check.rs"

# Throughput for information: the raw step loop of the core under the mixed stub's rule, on 1..4 threads.
[[bin]]
name = "stub-bench"
path = "src/bin/stub-bench.rs"

# The G0a (ii) checker: reads the bridge's records with the port's own reader and compares every ask's view digest.
[[bin]]
name = "bridge-walk"
path = "src/bin/bridge-walk.rs"

# P1's G1a and G1b checker (ATHENA.md §8.1, §8.2): the port's facts, rails and bridge-regime views against the
# reference's, over the corpus and the bridge's records.
[[bin]]
name = "facts-check"
path = "src/bin/facts-check.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# `cargo test --release` runs the 10,000-game fuzz vector; keep plain `cargo test` usable too.
[profile.test]
opt-level = 2
